[package]
name = "artifact-trust"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
description = "Sigstore verification for signed application and plugin artifacts"

[features]
default = ["verification"]
verification = ["dep:aws-lc-rs", "dep:base64", "dep:chrono", "dep:const-oid", "dep:rustls-pki-types", "dep:rustls-webpki", "dep:serde_json", "dep:serde_json_canonicalizer", "dep:sha2", "dep:sigstore", "dep:sigstore_protobuf_specs", "dep:tempfile", "dep:tokio", "dep:tracing", "dep:x509-cert"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
aws-lc-rs = { version = "1.18", default-features = false, features = ["non-fips"], optional = true }
base64 = { version = "0.22", optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
const-oid = { version = "0.10.2", features = ["db"], optional = true }
rustls-pki-types = { version = "1", optional = true }
rustls-webpki = { version = "0.103", default-features = false, features = ["std", "aws-lc-rs"], optional = true }
serde_json = { version = "1.0", features = ["preserve_order"], optional = true }
serde_json_canonicalizer = { version = "0.3", optional = true }
sha2 = { version = "0.11", optional = true }
sigstore = { version = "0.14", default-features = false, features = ["sigstore-trust-root"], optional = true }
sigstore_protobuf_specs = { version = "0.5.2", optional = true }
tempfile = { version = "3", optional = true }
tokio = { version = "1.53", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"], optional = true }
tracing = { version = "0.1", optional = true }
x509-cert = { version = "0.2", default-features = false, features = ["pem", "sct", "std"], optional = true }
